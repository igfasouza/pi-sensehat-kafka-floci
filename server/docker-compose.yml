# Base stack: Kafka (broker + tiered-storage plugin, cloud-neutral bits) and
# Karapace (Schema Registry). The Iceberg REST catalog and the object-storage
# emulator live in one of the per-cloud overrides:
#
#   docker-compose.s3.yml      Floci      (AWS S3-compatible)
#   docker-compose.gcs.yml     fake-gcs   (Google Cloud Storage)
#   docker-compose.azure.yml   Azurite    (Azure Blob / ADLS Gen2)
#
# Select one via COMPOSE_FILE in .env (see .env.example) or with:
#   docker compose -f docker-compose.yml -f docker-compose.<cloud>.yml up -d

services:
  kafka:
    image: apache/kafka:4.0.0
    hostname: kafka
    container_name: sense-kafka
    depends_on:
      - karapace
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://${PI_HOST:-localhost}:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms1G -Xmx2G

      # --- Tiered Storage: broker-side wiring ---
      KAFKA_REMOTE_LOG_STORAGE_SYSTEM_ENABLE: "true"
      KAFKA_REMOTE_LOG_METADATA_MANAGER_CLASS_NAME: org.apache.kafka.server.log.remote.metadata.storage.TopicBasedRemoteLogMetadataManager
      KAFKA_REMOTE_LOG_METADATA_MANAGER_LISTENER_NAME: PLAINTEXT
      KAFKA_RLMM_CONFIG_REMOTE_LOG_METADATA_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_RLMM_CONFIG_REMOTE_LOG_METADATA_TOPIC_NUM_PARTITIONS: 5
      KAFKA_REMOTE_LOG_MANAGER_TASK_INTERVAL_MS: "5000"
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: "5000"

      # --- Aiven RemoteStorageManager (Iceberg mode, alpha, v1.1.1) ---
      KAFKA_REMOTE_LOG_STORAGE_MANAGER_CLASS_NAME: io.aiven.kafka.tieredstorage.RemoteStorageManager
      KAFKA_REMOTE_LOG_STORAGE_MANAGER_CLASS_PATH: /opt/kafka/plugins/tiered-storage/*
      KAFKA_REMOTE_LOG_STORAGE_MANAGER_IMPL_PREFIX: rsm.config.
      KAFKA_RSM_CONFIG_CHUNK_SIZE: 4194304

      # FileSystemStorage is a required "storage backend" stub — Iceberg itself
      # writes to the object store via the *FileIO configured on the catalog.
      KAFKA_RSM_CONFIG_STORAGE_BACKEND_CLASS: io.aiven.kafka.tieredstorage.storage.filesystem.FileSystemStorage
      KAFKA_RSM_CONFIG_STORAGE_ROOT: /tmp/tiered-stub

      # Values are Avro; RSM resolves the writer schema via SR to build Parquet.
      KAFKA_RSM_CONFIG_STRUCTURE_PROVIDER_CLASS: io.aiven.kafka.tieredstorage.iceberg.AvroSchemaRegistryStructureProvider
      KAFKA_RSM_CONFIG_STRUCTURE_PROVIDER_SERDE_SCHEMA_REGISTRY_URL: http://karapace:8081

      KAFKA_RSM_CONFIG_SEGMENT_FORMAT: iceberg
      KAFKA_RSM_CONFIG_ICEBERG_NAMESPACE: default
      KAFKA_RSM_CONFIG_ICEBERG_CATALOG_CLASS: org.apache.iceberg.rest.RESTCatalog
      KAFKA_RSM_CONFIG_ICEBERG_CATALOG_URI: http://iceberg-rest:8181
      # Cloud-specific rsm.config.iceberg.catalog.* keys come from the override.
    volumes:
      - ${DATA_ROOT:-./data}/kafka:/var/lib/kafka/data
      - ./kafka/plugins:/opt/kafka/plugins
    restart: unless-stopped

  karapace:
    image: ghcr.io/aiven-open/karapace:4.1.1
    hostname: karapace
    container_name: sense-karapace
    depends_on:
      - kafka
    ports:
      - "8081:8081"
    environment:
      KARAPACE_ADVERTISED_HOSTNAME: karapace
      KARAPACE_BOOTSTRAP_URI: kafka:19092
      KARAPACE_PORT: 8081
      KARAPACE_HOST: 0.0.0.0
      KARAPACE_CLIENT_ID: karapace
      KARAPACE_GROUP_ID: karapace-registry
      KARAPACE_MASTER_ELIGIBILITY: "true"
      KARAPACE_TOPIC_NAME: _schemas
      KARAPACE_LOG_LEVEL: WARNING
      KARAPACE_COMPATIBILITY: FULL
    command: /opt/karapace/start.sh registry
    restart: unless-stopped
